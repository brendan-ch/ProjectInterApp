name: Run iOS tests

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened ]
  workflow_dispatch:

jobs:
  test:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'bypass ci/cd') }}
    name: Run unit tests on iOS
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Set Xcode version
        working-directory: app
        run: |
          # See https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
          sudo xcode-select -s /Applications/Xcode.app

      # Some macos-26 runner-image builds intermittently ship without the named
      # simulator, and the build step then dies with the cryptic "Unable to find
      # a device matching the provided destination specifier". Wait for the
      # device to show up, and if it still isn't there, create it ourselves —
      # simctl accepts a device-type name and picks the newest compatible
      # runtime. The bare substring match is anchored to "<name> (" so that
      # "iPhone 16 Pro Max" cannot satisfy a check for "iPhone 16 Pro".
      - name: Ensure simulator exists
        working-directory: app
        env:
          DEVICE: iPhone 17 Pro
        run: |
          for attempt in 1 2 3; do
            if xcrun simctl list devices available | grep -Fq "$DEVICE ("; then
              echo "Found simulator '$DEVICE' on attempt $attempt."
              exit 0
            fi
            echo "Simulator '$DEVICE' not found (attempt $attempt); waiting 15s..."
            sleep 15
          done
          echo "Simulator '$DEVICE' still missing; attempting to create it."
          if xcrun simctl create "$DEVICE" "$DEVICE"; then
            echo "Created simulator '$DEVICE'."
            exit 0
          fi
          echo "Failed to create simulator '$DEVICE'. Available devices and device types:"
          xcrun simctl list devices available
          xcrun simctl list devicetypes
          exit 1

      # Simulator builds need no code signing: Config/CI.xcconfig disables it,
      # so CI needs no Apple Team ID, certificates, or App Store credentials.
      - name: Build for testing
        working-directory: app
        run: |
          xcodebuild build-for-testing \
            -project ProjectInter.xcodeproj \
            -scheme ProjectInter \
            -testPlan ProjectInterTests \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -xcconfig Config/CI.xcconfig

      - name: Run tests
        id: tests
        continue-on-error: true
        working-directory: app
        run: |
          xcodebuild test-without-building \
            -project ProjectInter.xcodeproj \
            -scheme ProjectInter \
            -testPlan ProjectInterTests \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -enableCodeCoverage YES \
            -resultBundlePath ./output/unit-test.xcresult \
            -xcconfig Config/CI.xcconfig

      - name: Compress test result
        if: always()
        run: |
          ditto -c -k --keepParent "app/output/unit-test.xcresult" "output/unit-test.zip"

      - name: Upload test result
        id: unit-test-result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-result
          path: output/unit-test.zip

      - name: Post comment linking to artifact
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "Unit test coverage artifact: ${{ steps.unit-test-result.outputs.artifact-url }}"

      - name: Check for test failure
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Unit tests failed. Check the uploaded artifacts for details."
          exit 1

  test-ui:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'bypass ci/cd') }}
    name: Run UI tests on iOS
    runs-on: macos-26
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout server repository
        uses: actions/checkout@v4
        with:
          # See https://github.com/actions/checkout for other parameters
          repository: 'brendan-ch/project-inter-mock-server'
          token: ${{ secrets.GH_PAT }}
          path: server

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Run backend server
        working-directory: server
        run: |
          npm install
          # Use & to send to the background
          npm run dev &

      - name: Set Xcode version
        working-directory: app
        run: |
          # See https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
          sudo xcode-select -s /Applications/Xcode.app

      - name: Ensure simulator exists
        working-directory: app
        env:
          DEVICE: iPhone 17 Pro
        run: |
          for attempt in 1 2 3; do
            if xcrun simctl list devices available | grep -Fq "$DEVICE ("; then
              echo "Found simulator '$DEVICE' on attempt $attempt."
              exit 0
            fi
            echo "Simulator '$DEVICE' not found (attempt $attempt); waiting 15s..."
            sleep 15
          done
          echo "Simulator '$DEVICE' still missing; attempting to create it."
          if xcrun simctl create "$DEVICE" "$DEVICE"; then
            echo "Created simulator '$DEVICE'."
            exit 0
          fi
          echo "Failed to create simulator '$DEVICE'. Available devices and device types:"
          xcrun simctl list devices available
          xcrun simctl list devicetypes
          exit 1

      - name: Build for testing
        working-directory: app
        run: |
          xcodebuild build-for-testing \
            -project ProjectInter.xcodeproj \
            -scheme ProjectInter \
            -testPlan ProjectInterUITests \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -xcconfig Config/CI.xcconfig

      # In the event that UI tests fail, we want to be able to
      # diagnose what went wrong; not as critical for unit tests
      - name: Run tests
        id: tests
        continue-on-error: true
        working-directory: app
        run: |
          xcodebuild test-without-building \
            -project ProjectInter.xcodeproj \
            -scheme ProjectInter \
            -testPlan ProjectInterUITests \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -enableCodeCoverage YES \
            -resultBundlePath ./output/ui-test.xcresult \
            -xcconfig Config/CI.xcconfig

      - name: Compress test result
        if: always()
        run: |
          ditto -c -k --keepParent "app/output/ui-test.xcresult" "output/ui-test.zip"

      - name: Upload test result
        id: ui-test-result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-result
          path: output/ui-test.zip

      - name: Post comment linking to artifact
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "UI test coverage artifact: ${{ steps.ui-test-result.outputs.artifact-url }}"

      - name: Check for test failure
        if: steps.tests.outcome == 'failure'
        run: |
          echo "UI tests failed. Check the uploaded artifacts for details."
          exit 1
