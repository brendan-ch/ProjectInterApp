name: Run iOS tests

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened ]
  workflow_dispatch:

jobs:
  test:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'bypass ci/cd') }}
    name: Run unit tests on iOS
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Set Xcode version
        working-directory: app
        run: |
          # See https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
          sudo xcode-select -s /Applications/Xcode.app

      - name: Run Fastlane
        working-directory: app
        run: fastlane test
        env:
          CI: 1
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload test result
        id: unit-test-result
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-result
          path: app/test-output

      - name: Post comment linking to artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "Unit test coverage artifact: ${{ steps.unit-test-result.outputs.artifact-url }}"

 


  test-ui:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'bypass ci/cd') }}
    name: Run UI tests on iOS
    runs-on: macos-26
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout server repository
        uses: actions/checkout@v4
        with:
          # See https://github.com/actions/checkout for other parameters
          repository: 'brendan-ch/project-inter-mock-server'
          token: ${{ secrets.GH_PAT }}
          path: server

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Run backend server
        working-directory: server
        run: |
          npm install
          # Use & to send to the background
          npm run dev &

      - name: Set Xcode version
        working-directory: app
        run: |
          # See https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
          sudo xcode-select -s /Applications/Xcode.app

      - name: Run Fastlane
        # In the event that UI tests fail, we want to be able to
        # diagnose what went wrong; not as critical for unit tests
        continue-on-error: true
        id: fastlane-tests
        working-directory: app
        run: fastlane test_ui
        env:
          CI: 1
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload test result
        id: ui-test-result
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-result
          path: app/test-ui-output

      - name: Post comment linking to artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "UI test coverage artifact: ${{ steps.ui-test-result.outputs.artifact-url }}"

      - name: Check for UI test failure
        if: steps.fastlane-tests.outcome == 'failure'
        run: |
          echo "UI tests failed. Check the uploaded artifacts for details."
          exit 1

