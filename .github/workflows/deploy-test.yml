name: Deploy testing build

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened ]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.label.name != 'release' && !contains(github.event.pull_request.labels.*.name, 'bypass ci/cd') }}
    runs-on: macos-26
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Set Xcode version
        run: |
          # See https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
          # Default: Xcode 26 (via symlink)
          sudo xcode-select -s /Applications/Xcode.app


      - name: Run Fastlane
        run: fastlane beta
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          CI: 1

