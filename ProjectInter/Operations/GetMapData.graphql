query GetMapData($systemId: ID!) {
  system(id: $systemId) {
    stops {
      name
      coordinates {
        latitude
        longitude
      }
    }
    shuttles {
      coordinates {
        latitude
        longitude
      }
      route {
        color
        id
      }
      id
      name
    }
    routes {
      polylineCoordinates {
        latitude
        longitude
      }
      color
      id
    }
  }
}
