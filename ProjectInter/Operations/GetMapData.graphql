query GetMapData($systemId: ID!) {
  system(id: $systemId) {
    parkingSystem {
      parkingStructures {
        coordinates {
          latitude
          longitude
        }
        id
      }
    }
    stops {
      id
      name
      coordinates {
        latitude
        longitude
      }
      orderedStops {
        routeId
      }
    }
    shuttles {
      coordinates {
        latitude
        longitude
      }
      route {
        color
        id
      }
      id
      name
      orientationInDegrees
    }
    routes {
      polylineCoordinates {
        latitude
        longitude
      }
      color
      id
    }
  }
}
