query GetRoutesAndETAData($systemId: ID!, $stopId: ID!) {
  system(id: $systemId) {
    shuttles {
      coordinates {
        latitude
        longitude
      }
      route {
        color
      }
      id
    }
    stop(id: $stopId) {
      name,
      orderedStops {
        route {
          id,
          name,
          color,
          shuttles {
            etas {
              secondsRemaining
            }
          }
        }
        nextStop {
          stop {
            name,
            id
          }
        },
      }
    }
  }
}
