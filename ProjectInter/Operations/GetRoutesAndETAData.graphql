query GetRoutesAndETAData($systemId: ID!, $stopId: ID!) {
  system(id: $systemId) {
    stop(id: $stopId) {
      name,
      orderedStops {
        route {
          id,
          name,
          color,
          shuttles {
            etas {
              secondsRemaining
            }
          }
        }
        nextStop {
          stop {
            name,
            id
          }
        },
      }
    }
  }
}
