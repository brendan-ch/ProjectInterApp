query GetParkingStructureInfoData(
  $systemId: ID!,
  $parkingStructureId: ID!,
  $historicalAveragesInput: HistoricalParkingAverageQueryInput
) {
  system(id: $systemId) {
    parkingSystem {
      parkingStructure(id: $parkingStructureId) {
        capacity
        name
        spotsAvailable
        id
        address
        historicalAverages(input: $historicalAveragesInput) {
          from
          to
          averageSpotsAvailable
        }
      }
    }
  }
}

