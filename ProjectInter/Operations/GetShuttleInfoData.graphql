query GetShuttleInfoData($systemId: ID!, $shuttleId: ID!, $notificationInput: NotificationInput!) {
  system(id: $systemId) {
    shuttle(id: $shuttleId) {
      name
      etas {
        stop {
          name
          id
        }
        secondsRemaining
      }
    }
  }
  secondsThresholdForNotification(input: $notificationInput)
}
